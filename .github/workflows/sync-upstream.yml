name: 🔄 Auto Sync Fork with Upstream

on:
  # 每天凌晨 3 点（UTC 时间）自动执行一次
  schedule:
    - cron: '0 3 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ 检出你自己的仓库
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # 必须完整历史，否则无法合并

      # 2️⃣ 配置 Git 用户信息
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 3️⃣ 添加上游仓库并拉取最新代码
      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/v2board/v2board.git
          git fetch upstream

      # 4️⃣ 合并上游的 master 分支
      - name: Merge upstream changes
        run: |
          git checkout master
          git merge upstream/master || true

      # 5️⃣ 推送更新到你自己的 fork
      - name: Push changes to your fork
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin master
